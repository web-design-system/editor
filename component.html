<template component="wds-editor" shadow-dom="open">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="component" href="/static/web-design-system/action-button/latest/component.html" />
  <link rel="component" href="/static/web-design-system/panel/latest/component.html" />
  <link rel="component" href="/static/web-design-system/viewport-control/latest/component.html" />

  <section class="wds-workbench">
    <aside class="wds-workbench__sidebar">
      <wds-panel>
        <span slot="eyebrow">WDS / REGISTRY</span>
        <span slot="title">{{ team }}</span>
        <wds-action-button on-press="createComponent()">New component</wds-action-button>
        <nav class="mt-lg grid gap-xxs text-sm">
          <wds-action-button tone="quiet">{{ component }}</wds-action-button>
          <wds-action-button tone="quiet">Baseline styles</wds-action-button>
        </nav>
      </wds-panel>
    </aside>

    <main class="wds-workbench__workspace">
      <header class="wds-workbench__toolbar">
        <div>
          <p class="wds-workbench__muted font-mono text-xs">{{ team }} / {{ component }}</p>
          <strong>{{ activeFile }}</strong>
        </div>
        <wds-action-button on-press="commit()">Commit to latest</wds-action-button>
      </header>

      <textarea
        class="wds-workbench__source"
        bind-value="source"
        on-input="updateSource($event)"
        aria-label="Component source"
      ></textarea>

      <footer class="flex justify-between border-t border-slate-700 px-md py-xs font-mono text-xs text-slate-400">
        <span class="wds-workbench__muted">{{ status }}</span>
        <span>CTRL + ENTER commits</span>
      </footer>
    </main>

    <aside class="wds-workbench__inspector">
      <wds-panel>
        <span slot="eyebrow">DESIGN INSPECTOR</span>
        <span slot="title">Canvas controls</span>
        <dl class="grid gap-sm text-sm">
          <div><dt class="text-slate-400">Viewport</dt><dd>{{ viewport }}px</dd></div>
          <div><dt class="text-slate-400">Runtime</dt><dd>Li3 / Shadow DOM</dd></div>
          <div><dt class="text-slate-400">Revision</dt><dd>{{ revision }}</dd></div>
        </dl>
        <wds-viewport-control bind-value="viewport" on-change="setViewport($event.detail)"></wds-viewport-control>
      </wds-panel>
    </aside>
  </section>

  <script setup src="./editor.mjs"></script>
</template>
