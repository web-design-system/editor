<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18181b" />
    <title>WDS · Design systems</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/editor-nav.css" />
    <script type="importmap">
      { "imports": { "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
  </head>
  <body>
    <template app>
      <div id="app-root">
        <div class="shell" id="landing">
          <section
            class="guest-welcome grid min-h-dvh w-[min(1040px,calc(100%-48px))] mx-auto items-center gap-[clamp(40px,9vw,132px)] py-16 grid-cols-[minmax(0,.9fr)_minmax(340px,.8fr)] max-[760px]:grid-cols-1 max-[760px]:w-[min(500px,calc(100%-36px))] max-[760px]:gap-[30px] max-[760px]:py-9 max-[390px]:gap-5 max-[390px]:py-6"
            id="guest-welcome"
            aria-labelledby="welcome-title"
            hidden
          >
            <div class="welcome-copy max-w-[490px]">
              <h1
                class="max-[760px]:max-w-[430px] text-[clamp(34px,4.4vw,52px)] font-medium leading-[1.08] tracking-[-.055em] min-[1001px]:max-w-none min-[1001px]:text-[clamp(38px,3.8vw,44px)] min-[1001px]:whitespace-nowrap max-[760px]:text-[clamp(34px,9vw,42px)] max-[390px]:text-[35px]"
                id="welcome-title"
              >
                A home for your team’s UX
              </h1>
              <p
                class="welcome-description mt-[19px] max-w-[410px] text-sm leading-[1.75] text-[#a1a1aa]"
                id="welcome-description"
              >
                Design components, edit code, and share the foundations of your product—all in one studio.
              </p>
              <p
                class="welcome-error mt-4 text-xs leading-[1.6] text-red-300"
                id="welcome-error"
                role="status"
                hidden
              ></p>
              <a
                class="welcome-action mt-7 inline-flex min-h-[42px] items-center justify-between gap-7 rounded border border-zinc-100 bg-zinc-100 px-[14px] text-xs font-medium text-zinc-900 transition-colors hover:bg-white"
                href="/api/oidc/login"
                >Get started <span class="text-[15px] text-zinc-600" aria-hidden="true">→</span></a
              >
              <p class="welcome-footnote mt-4 text-[11px] text-zinc-500" id="welcome-footnote" hidden></p>
            </div>
            <div
              class="welcome-preview relative rounded-[7px] border border-zinc-800 bg-gradient-to-br from-zinc-900 to-[#111114] p-3 shadow-[0_24px_80px_#0005]"
              aria-hidden="true"
            >
              <div
                class="preview-top flex h-[34px] items-center gap-[9px] border-b border-zinc-800 px-1 pb-[11px] text-[8px] tracking-[.08em] text-zinc-500"
              >
                <span
                  class="preview-mark grid h-[19px] w-[19px] place-items-center rounded-[3px] bg-blue-500 text-[9px] text-white"
                  >W</span
                ><span>ACME / FOUNDATION</span><i class="ml-auto h-[5px] w-[5px] rounded-full bg-green-400"></i>
              </div>
              <div
                class="preview-content grid min-h-[217px] grid-cols-[92px_minmax(0,1fr)] max-[760px]:min-h-[172px] max-[390px]:min-h-[148px] max-[390px]:grid-cols-[72px_minmax(0,1fr)]"
              >
                <div
                  class="preview-sidebar flex flex-col gap-[13px] border-r border-zinc-800 py-[19px] pr-[10px] pl-1 max-[390px]:pt-[15px]"
                >
                  <b class="block h-[5px] w-12 rounded-[3px] bg-zinc-600"></b
                  ><span class="block h-1 w-[60px] rounded-[3px] bg-zinc-700"></span
                  ><span class="block h-1 w-11 rounded-[3px] bg-zinc-700"></span
                  ><span class="block h-1 w-[60px] rounded-[3px] bg-zinc-700"></span>
                </div>
                <div class="preview-canvas p-[20px_18px] max-[760px]:p-[15px] max-[390px]:p-[13px]">
                  <span class="preview-kicker text-[7px] tracking-[.1em] text-zinc-500">DESIGN TOKENS</span
                  ><b class="mt-3 block h-[10px] w-[94px] rounded-[3px] bg-zinc-400"></b
                  ><span class="preview-line mt-2 block h-1 w-[73%] rounded-[3px] bg-zinc-700"></span>
                  <div class="preview-swatches mt-[22px] flex gap-[7px] max-[760px]:mt-[14px]">
                    <i
                      class="h-[25px] w-[25px] rounded border border-white/10 bg-blue-500 max-[390px]:h-[22px] max-[390px]:w-[22px]"
                    ></i
                    ><i
                      class="h-[25px] w-[25px] rounded border border-white/10 bg-violet-400 max-[390px]:h-[22px] max-[390px]:w-[22px]"
                    ></i
                    ><i
                      class="h-[25px] w-[25px] rounded border border-white/10 bg-emerald-400 max-[390px]:h-[22px] max-[390px]:w-[22px]"
                    ></i
                    ><i
                      class="h-[25px] w-[25px] rounded border border-white/10 bg-amber-400 max-[390px]:h-[22px] max-[390px]:w-[22px]"
                    ></i>
                  </div>
                  <div
                    class="preview-component mt-[18px] flex items-center gap-[9px] rounded border border-zinc-800 p-2.5 max-[760px]:mt-3"
                  >
                    <span class="block h-5 w-5 rounded-[3px] bg-zinc-800"></span
                    ><b class="block h-[5px] w-14 rounded-[3px] bg-zinc-700"></b
                    ><i class="ml-auto block h-[15px] w-7 rounded-[3px] bg-blue-500"></i>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <wds-dashboard-layout
            class="dashboard-layout block min-h-dvh aria-busy:invisible"
            id="dashboard-layout"
            aria-busy="true"
          >
            <wds-sidebar-panel class="workspace-sidebar block min-w-0" slot="sidebar" aria-label="Workspace navigation">
              <button
                class="user-card sidebar-user-card mb-4 flex w-full cursor-pointer items-center gap-3 rounded-xl border border-zinc-800 bg-zinc-950 p-3 text-left hover:border-zinc-600"
                id="sidebar-user-card"
                type="button"
                aria-label="Open preferences"
                hidden
              ></button>
              <details class="team-drawer" open>
                <summary
                  class="hidden max-[760px]:flex max-[760px]:min-h-11 max-[760px]:items-center max-[760px]:justify-between max-[760px]:text-xs max-[760px]:list-none"
                  id="team-navigation-label"
                >
                  All teams
                </summary>
                <div class="section-heading mb-2.5 flex items-baseline justify-between gap-3 px-2">
                  <h2 class="text-[10px] uppercase tracking-[.1em] text-zinc-400" id="teams-title">Teams</h2>
                  <span class="section-note text-[11px] text-zinc-400" id="team-summary"></span>
                </div>
                <wds-data-list class="team-list my-3 flex flex-col gap-1" id="team-list">
                  <span class="loading text-xs text-zinc-400">Loading teams…</span>
                </wds-data-list>
                <button
                  type="button"
                  class="sidebar-create w-full rounded border border-dashed border-zinc-700 bg-transparent p-[9px] text-left text-xs text-zinc-400 hover:border-blue-400 hover:text-blue-400"
                  data-create="team"
                  hidden
                >
                  ＋ New team
                </button>
              </details>
            </wds-sidebar-panel>
            <main
              class="main dashboard-main min-w-0 w-full max-w-none px-6 py-4 pb-8 max-[760px]:px-3 max-[760px]:py-3"
              slot="main"
              aria-label="Workspace"
            >
              <header
                class="app-topbar mb-4 flex min-h-14 items-center gap-3 border-b border-zinc-800 pb-3"
                id="app-topbar"
                hidden
              >
                <a class="brand inline-flex shrink-0 items-center gap-2.5" href="/" aria-label="WDS home"
                  ><span class="brand-mark grid size-8 place-items-center rounded bg-blue-500 text-white">W</span
                  ><span class="brand-name text-sm font-semibold">Workbench</span></a
                >
                <button
                  type="button"
                  class="editor-nav-toggle hidden rounded border border-zinc-700 px-2 py-1 text-xs"
                  aria-label="Open layers"
                  aria-expanded="false"
                  aria-controls="project-content"
                >
                  ☰
                </button>
                <span
                  class="workspace-name flex min-w-0 flex-1 items-center gap-2 truncate text-zinc-300"
                  id="workspace-name"
                ></span>
              </header>
              <section
                class="mx-auto grid min-h-[calc(100dvh-56px)] w-[min(560px,calc(100%-36px))] content-center justify-items-center py-12 text-center"
                id="first-team-empty"
                aria-labelledby="first-team-title"
                hidden
              >
                <p class="mb-2 text-[10px] font-semibold uppercase tracking-[.16em] text-blue-400">GET STARTED</p>
                <h1 class="m-0 text-2xl font-semibold tracking-[-.04em] text-zinc-100" id="first-team-title">
                  Create your first team
                </h1>
                <p class="mt-3 max-w-[390px] text-sm leading-6 text-zinc-400">
                  A team is the home for your design systems and components.
                </p>
                <button
                  class="mt-7 h-11 rounded border border-blue-400 bg-blue-500 px-5 text-sm font-medium text-white transition-colors hover:bg-blue-400"
                  type="button"
                  data-create="team"
                >
                  Create team
                </button>
              </section>
              <section
                id="preferences-view"
                class="mx-auto hidden w-full max-w-5xl rounded-3xl border border-zinc-200 bg-white p-6 text-slate-900 shadow-sm sm:p-10"
                aria-labelledby="preferences-title"
              >
                <div class="mb-8 flex items-center gap-4">
                  <span class="text-3xl text-emerald-950" aria-hidden="true">♙</span>
                  <div>
                    <h1 class="m-0 text-3xl font-bold tracking-tight" id="preferences-title">Your profile</h1>
                    <p class="mt-1 text-lg text-slate-500">Manage your account and workspace preferences.</p>
                  </div>
                </div>
                <div
                  class="mb-6 flex items-center gap-4 rounded-3xl border border-slate-100 bg-slate-50 p-6"
                  id="preferences-profile"
                ></div>
                <section
                  class="divide-y divide-slate-200 rounded-3xl border border-slate-200 p-6"
                  aria-labelledby="theme-preference-title"
                >
                  <div class="pb-6">
                    <h2 class="m-0 text-xl font-bold" id="theme-preference-title">Page theme</h2>
                    <p class="mt-2 text-slate-500">Choose how WDS looks on this device.</p>
                    <label class="mt-4 grid max-w-sm gap-2 text-sm font-semibold"
                      >Theme<select
                        id="theme-preference"
                        class="h-11 rounded-lg border border-slate-300 bg-white px-3 text-base"
                      >
                        <option value="system">System</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                      </select></label
                    >
                    <p
                      id="theme-status"
                      class="mt-2 min-h-5 text-sm text-slate-600"
                      role="status"
                      aria-live="polite"
                    ></p>
                  </div>
                  <div class="flex items-center justify-between gap-4 py-6 max-sm:flex-col max-sm:items-start">
                    <div>
                      <h2 class="m-0 text-lg font-bold">Sign out</h2>
                      <p class="mt-1 text-slate-500">End your current session on this device.</p>
                    </div>
                    <button
                      class="rounded-xl border border-red-200 px-5 py-3 font-semibold text-red-700 hover:bg-red-50"
                      type="button"
                      id="preferences-sign-out"
                    >
                      Sign out
                    </button>
                  </div>
                </section>
              </section>
              <div id="dashboard-content">
                <nav
                  class="breadcrumbs mb-4 flex flex-wrap items-center gap-2.5 text-xs text-zinc-500"
                  id="dashboard-breadcrumbs"
                  aria-label="Breadcrumb"
                >
                  <span class="text-zinc-300">Workspace</span>
                </nav>
                <div class="dashboard-heading flex items-center justify-between gap-3">
                  <div>
                    <h1 class="text-[22px] font-semibold text-zinc-100" id="dashboard-title" hidden></h1>
                  </div>
                  <a
                    id="system-settings-link"
                    class="grid h-10 w-10 shrink-0 place-items-center rounded border border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-zinc-100 focus-visible:outline-2 focus-visible:outline-blue-400"
                    href="#"
                    aria-label="Open design system settings"
                    title="Design system settings"
                    hidden
                  >
                    <svg
                      viewBox="0 0 24 24"
                      class="h-5 w-5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"
                      />
                    </svg>
                  </a>
                  <button
                    type="button"
                    class="primary-button rounded border border-zinc-100 bg-zinc-100 px-3 py-2 text-xs font-medium text-zinc-900 hover:bg-white"
                    data-create="system"
                    hidden
                  >
                    ＋ New design system
                  </button>
                </div>
                <p
                  class="notice rounded border border-zinc-700 bg-zinc-900 p-3 px-4"
                  id="notice"
                  role="status"
                  aria-live="polite"
                  hidden
                ></p>
                <section class="section mt-5" aria-label="Repositories and systems">
                  <div class="list-toolbar mb-2.5 flex items-center gap-3">
                    <input
                      class="min-w-0 h-9 w-[min(280px,100%)] rounded border border-zinc-800 bg-zinc-900 px-2.5 py-2 text-xs text-zinc-200"
                      id="system-filter"
                      type="search"
                      aria-label="Find a system"
                      placeholder="Find a system…"
                    /><span class="section-note ml-auto text-[11px] text-zinc-400" id="system-summary"></span>
                    <h2 id="systems-title" hidden>Design systems</h2>
                  </div>
                  <wds-data-list
                    class="system-grid grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-3"
                    id="system-grid"
                  >
                    <span class="loading text-xs text-zinc-400">Loading design systems…</span>
                  </wds-data-list>
                  <p
                    id="filter-empty"
                    class="empty rounded border border-dashed border-zinc-700 bg-zinc-900/50 p-5 text-center text-xs"
                    hidden
                  >
                    No matches.
                  </p>
                </section>
              </div>
              <section
                class="mx-auto grid min-h-[calc(100dvh-80px)] w-[min(560px,calc(100%-36px))] content-center justify-items-center py-12 text-center"
                id="first-system-empty"
                aria-labelledby="first-system-title"
                hidden
              >
                <svg class="mb-8 h-40 w-48" viewBox="0 0 192 160" fill="none" aria-hidden="true">
                  <circle cx="96" cy="82" r="70" fill="#2563EB" fill-opacity=".08" />
                  <path d="M48 52.5 96 34l48 18.5v56L96 127l-48-18.5v-56Z" fill="#18181B" stroke="#3F3F46" />
                  <path d="m49 53 47 18 47-18M96 72v54" stroke="#52525B" stroke-linejoin="round" />
                  <rect x="63" y="54" width="66" height="39" rx="5" fill="#27272A" stroke="#52525B" />
                  <rect x="72" y="64" width="28" height="5" rx="2.5" fill="#60A5FA" />
                  <rect x="72" y="75" width="46" height="4" rx="2" fill="#71717A" />
                  <rect x="72" y="84" width="34" height="4" rx="2" fill="#52525B" />
                  <circle cx="132" cy="41" r="10" fill="#2563EB" fill-opacity=".2" />
                  <path d="M132 36v10m-5-5h10" stroke="#93C5FD" stroke-linecap="round" stroke-width="1.5" />
                </svg>
                <p class="mb-2 text-[10px] font-semibold uppercase tracking-[.16em] text-blue-400">
                  Your team’s foundation
                </p>
                <h1 class="m-0 text-2xl font-semibold tracking-[-.04em] text-zinc-100" id="first-system-title">
                  Create your first design system.
                </h1>
                <p class="mt-3 max-w-[390px] text-sm leading-6 text-zinc-400">
                  Give your team one shared place for design tokens, styles, and components.
                </p>
                <form class="mt-7 flex w-full max-w-[420px] gap-2" id="first-system-form">
                  <label class="sr-only" for="first-system-name">Design system name</label>
                  <input
                    class="h-11 min-w-0 flex-1 rounded border border-zinc-700 bg-zinc-900 px-3 text-sm text-zinc-100 outline-none placeholder:text-zinc-500 focus:border-blue-400"
                    id="first-system-name"
                    name="name"
                    placeholder="Name"
                    maxlength="100"
                    autocomplete="off"
                    required
                  />
                  <button
                    class="h-11 shrink-0 rounded border border-blue-400 bg-blue-500 px-5 text-sm font-medium text-white transition-colors hover:bg-blue-400 disabled:cursor-wait disabled:opacity-60"
                    type="submit"
                  >
                    Create
                  </button>
                </form>
                <p
                  class="mt-3 min-h-5 text-xs text-red-300"
                  id="first-system-status"
                  role="status"
                  aria-live="polite"
                ></p>
              </section>
            </main>
          </wds-dashboard-layout>
          <dialog
            class="mx-auto my-auto w-[min(480px,calc(100%-32px))] max-h-[calc(100dvh-48px)] overflow-auto rounded-lg border border-zinc-700 bg-zinc-900 p-7 text-zinc-300 shadow-[0_24px_80px_#0008] backdrop:bg-[#09090bcc] backdrop:backdrop-blur"
            id="creation-dialog"
            aria-label="Create workspace resource"
          >
            <button
              type="button"
              class="dialog-close absolute right-3 top-2.5 h-7 w-7 border-0 bg-transparent text-[22px] text-zinc-400"
              aria-label="Close dialog"
            >
              ×
            </button>
            <section class="creation m-0 block" id="creation-controls" aria-label="Create team or design system" hidden>
              <form id="team-form" class="creation-form grid gap-2.5 border-0 bg-transparent p-0">
                <h2 class="m-0 text-xl font-medium tracking-[-.03em]">Create a team</h2>
                <p class="form-description mb-3 mt-0 text-xs leading-[1.7] text-zinc-400">
                  A home for your design systems. Each team can own multiple systems.
                </p>
                <label class="text-xs text-zinc-400" for="team-slug">Team slug</label>
                <input
                  class="rounded border border-zinc-700 bg-zinc-950 px-2.5 py-[9px] text-[13px] text-zinc-200"
                  id="team-slug"
                  name="slug"
                  required
                  maxlength="100"
                  pattern="[a-z0-9][a-z0-9._\-]*"
                  autocomplete="off"
                />
                <button
                  class="mt-2 justify-self-stretch rounded border border-zinc-100 bg-zinc-100 px-3 py-2 text-xs font-medium text-zinc-900 hover:bg-white"
                  type="submit"
                >
                  Create team
                </button>
              </form>
              <form id="system-form" class="creation-form grid gap-2.5 border-0 bg-transparent p-0">
                <h2 class="m-0 text-xl font-medium tracking-[-.03em]">Create a design system</h2>
                <p class="form-description mb-3 mt-0 text-xs leading-[1.7] text-zinc-400">
                  Creates a Git organization and its Foundation repository for shared design tokens.
                </p>
                <label class="text-xs text-zinc-400" for="system-team">Team</label>
                <select
                  class="rounded border border-zinc-700 bg-zinc-950 px-2.5 py-[9px] text-[13px] text-zinc-200"
                  id="system-team"
                  name="team"
                  required
                ></select>
                <button
                  type="button"
                  class="text-button min-h-0 border-0 bg-transparent p-0 text-left text-[11px] font-normal text-blue-400"
                  id="create-team-link"
                  data-create="team"
                >
                  Create a team first
                </button>
                <label class="text-xs text-zinc-400" for="system-repo">Design-system slug</label>
                <input
                  class="rounded border border-zinc-700 bg-zinc-950 px-2.5 py-[9px] text-[13px] text-zinc-200"
                  id="system-repo"
                  name="repo"
                  required
                  maxlength="100"
                  pattern="[a-z0-9][a-z0-9._\-]*"
                  autocomplete="off"
                />
                <label class="text-xs text-zinc-400" for="system-org">Git organization slug</label>
                <input
                  class="rounded border border-zinc-700 bg-zinc-950 px-2.5 py-[9px] text-[13px] text-zinc-200"
                  id="system-org"
                  name="gitOrg"
                  required
                  maxlength="100"
                  pattern="[a-z0-9][a-z0-9._\-]*"
                />
                <label class="text-xs text-zinc-400" for="system-name">Display name (optional)</label>
                <input
                  class="rounded border border-zinc-700 bg-zinc-950 px-2.5 py-[9px] text-[13px] text-zinc-200"
                  id="system-name"
                  name="name"
                  maxlength="100"
                />
                <label class="text-xs text-zinc-400" for="system-description">Description (optional)</label>
                <textarea
                  class="rounded border border-zinc-700 bg-zinc-950 px-2.5 py-[9px] text-[13px] text-zinc-200"
                  id="system-description"
                  name="description"
                  maxlength="500"
                  rows="3"
                ></textarea>
                <button
                  class="mt-2 justify-self-stretch rounded border border-zinc-100 bg-zinc-100 px-3 py-2 text-xs font-medium text-zinc-900 hover:bg-white"
                  type="submit"
                >
                  Create design system
                </button>
              </form>
            </section>
            <p class="text-xs leading-[1.6] text-zinc-400" id="creation-status" role="status" aria-live="polite"></p>
          </dialog>
        </div>
        <div class="workspace hidden" id="workspace">
          <main class="work-area min-h-0 bg-zinc-950 p-0" id="work-area" aria-label="Design system workspace">
            <p class="text-xs text-zinc-400" role="status" id="work-status">Loading project…</p>
            <section id="project-content"></section>
          </main>
        </div>
      </div>
    </template>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>
